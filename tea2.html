    :root {

      --glass-border: rgba(165, 200, 255, 0.24);
      --card-bg: rgba(11, 20, 38, 0.94);
      --text-main: #f4f7fc;
      --text-muted: #a9bddb;
      --accent-green: #6ee7b7;
      --accent-herb: #c4b5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-color: #050b18;
      background-image: url('./resources/images/tea/nightskybetter.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 3.6vw, 3.1rem);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85), 0 0 24px rgba(240, 200, 75, 0.35);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 720px;
      margin: 0 auto 14px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pill {
      background: rgba(13, 27, 50, 0.78);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
    }

    .pill strong {
      color: var(--gold);
    }

    .btn-jump {
      background: rgba(240, 200, 75, 0.16);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-jump:hover {
      background: rgba(240, 200, 75, 0.3);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 1050px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 720px) {
      .calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .day-cell {
      position: relative;
      min-height: 122px;
      padding: 10px 8px;
      border-right: 1px solid rgba(165, 200, 255, 0.18);
      border-bottom: 1px solid rgba(165, 200, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      text-align: center;
    }

    .day-cell.row-mid {
      background: rgba(145, 178, 218, 0.14);
    }

    .day-cell:hover {
      background: rgba(240, 200, 75, 0.14);
      z-index: 2;
    }

    .day-cell.selected {
      background: rgba(240, 200, 75, 0.2);
      box-shadow: inset 0 0 0 2px var(--gold);
      z-index: 3;
    }

    .day-cell.today {
      box-shadow: inset 0 0 0 2px #38bdf8, 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .day-cell.today.selected {
      box-shadow: inset 0 0 0 2px var(--gold), 0 0 20px var(--gold-glow);
    }

    .cell-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .day-num {
      font-weight: 700;
      color: #fff;
    }

    .today-badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .moon-icon {
      width: 46px;
      height: 46px;
      margin: 4px 0;
      filter: drop-shadow(0 0 6px rgba(255, 255, 230, 0.25));
    }

    .cell-tea-preview {
      font-size: 0.72rem;
      line-height: 1.25;
      color: #e2e8f0;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail-panel {
      background: var(--card-bg);
      border: 1px solid rgba(240, 200, 75, 0.4);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      position: sticky;
      top: 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .panel-moon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .panel-phase-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 700;
    }

    .panel-title {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      color: #fff;
      margin-top: 2px;
    }

    .tea-block {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .tea-block:last-child {
      margin-bottom: 0;
    }

    .tea-slot-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .tag-day {
      background: rgba(110, 231, 183, 0.16);
      color: var(--accent-green);
      border: 1px solid rgba(110, 231, 183, 0.35);
    }

    .tag-evening {
      background: rgba(196, 181, 253, 0.16);
      color: var(--accent-herb);
      border: 1px solid rgba(196, 181, 253, 0.35);
    }

    .tea-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
    }

    .tea-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 4px 0 8px;
    }

    .ingredient-chips {

      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

      background: rgba(15, 35, 66, 0.9);
      border: 1px solid rgba(148, 184, 235, 0.25);
      color: #dbeafe;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
    }

      font-size: 0.88rem;
      color: #e2e8f0;
      background: rgba(240, 200, 75, 0.08);
      border-left: 3px solid var(--gold);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
    }
  </style>

    function getCurrentLunarDay(date = new Date()) {
      const SYNODIC_MONTH = 29.53058867;
      const KNOWN_NEW_MOON = Date.UTC(2024, 0, 11, 11, 57, 0);
      const daysSince = (date.getTime() - KNOWN_NEW_MOON) / (1000 * 60 * 60 * 24);
      const cycleFraction = (((daysSince % SYNODIC_MONTH) + SYNODIC_MONTH) % SYNODIC_MONTH) / SYNODIC_MONTH;
      const lunarDay = Math.floor(cycleFraction * 28) + 1;
      return Math.min(28, Math.max(1, lunarDay));
    }

    function createMoonSVG(day, className = "moon-icon") {
      const r = 20;
      const cx = 24;
      const cy = 24;
      let pathD = "";

      if (day === 1 || day === 28) {
        pathD = "";
      } else if (day === 14 || day === 15) {
        pathD = "M " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 1 1 " + cx + " " + (cy + r) + " A " + r + " " + r + " 0 1 1 " + cx + " " + (cy - r);
      } else if (day < 14) {
        const p = (day - 1) / 13;
        const k = Math.cos(p * Math.PI);
        const rx = Math.abs(k) * r;
        const sweepInner = k > 0 ? 0 : 1;
        pathD = "M " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 0 1 " + cx + " " + (cy + r) + " A " + rx + " " + r + " 0 0 " + sweepInner + " " + cx + " " + (cy - r);
      } else {
        const p = (day - 15) / 13;
        const k = Math.cos(p * Math.PI);
        const rx = Math.abs(k) * r;
        const sweepInner = k > 0 ? 0 : 1;
        pathD = "M " + cx + " " + (cy - r) + " A " + r + " " + r + " 0 0 0 " + cx + " " + (cy + r) + " A " + rx + " " + r + " 0 0 " + sweepInner + " " + cx + " " + (cy - r);
      }

      return `
        <svg viewBox="0 0 48 48" class="${className}" aria-hidden="true">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#070d19" stroke="rgba(226, 232, 240, 0.35)" stroke-width="1.2"/>
          ${pathD ? `<path d="${pathD}" fill="#e8edf5" />` : ""}
        </svg>
      `;
    }

    const todayLunarDay = getCurrentLunarDay();
    let selectedDay = todayLunarDay;

    function updateStatus() {
      const todayInfo = TEA_CALENDAR[todayLunarDay - 1];
      document.getElementById("today-status").innerHTML =
        `Today's Lunar Phase: <strong>Day ${todayLunarDay} (${todayInfo.phase})</strong>`;
    }

    function renderGrid() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";

      TEA_CALENDAR.forEach((item, index) => {
        const row = Math.floor(index / 7);
        const isMidRow = row === 1 || row === 2;
        const isToday = item.day === todayLunarDay;
        const isSelected = item.day === selectedDay;

        const cell = document.createElement("div");
        cell.className = `day-cell ${isMidRow ? "row-mid" : ""} ${isToday ? "today" : ""} ${isSelected ? "selected" : ""}`;
        cell.setAttribute("role", "button");
        cell.setAttribute("tabindex", "0");
        cell.setAttribute("aria-label", `Day ${item.day}, ${item.phase}: ${item.eveningTea.name}`);

        cell.innerHTML = `
          <div class="cell-top">
            <span class="day-num">Day ${item.day}</span>
            ${isToday ? `<span class="today-badge">Today</span>` : ""}
          </div>
          ${createMoonSVG(item.day)}
          <div class="cell-tea-preview">${item.eveningTea.name}</div>
        `;

        cell.addEventListener("click", () => {
          selectedDay = item.day;
          renderGrid();
          renderDetailPanel();
        });

        cell.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectedDay = item.day;
            renderGrid();
            renderDetailPanel();
          }
        });

        grid.appendChild(cell);
      });
    }

    function renderDetailPanel() {
      const panel = document.getElementById("detail-panel");

      const isToday = selectedDay === todayLunarDay;

      panel.innerHTML = `

          </div>
        </div>
      `;
    }
