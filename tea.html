<html lang="en">

    :root {
      --gold: #f0c84b;
      --gold-glow: rgba(240, 200, 75, 0.45);
      --glass-bg: rgba(16, 30, 54, 0.58);
      --glass-border: rgba(165, 200, 255, 0.24);
      --card-bg: rgba(11, 20, 38, 0.94);
      --text-main: #f4f7fc;
      --text-muted: #a9bddb;
      --accent-green: #6ee7b7;
      --accent-herb: #c4b5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      /* Deep starry night sky + subtle Milky Way glow (swap url() if using your own starry background image) */
      background:
        radial-gradient(ellipse at 20% 30%, rgba(56, 114, 189, 0.28) 0%, transparent 55%),
        radial-gradient(ellipse at 78% 68%, rgba(88, 130, 195, 0.24) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, #0d2244 0%, #050b18 75%, #02050c 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      position: relative;
    }

    /* Procedural twinkling starfield layer */
    #starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 3.6vw, 3.1rem);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.03em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85), 0 0 24px rgba(240, 200, 75, 0.35);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 720px;
      margin: 0 auto 14px;
    }

    /* Status & Diversity Bar */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pill {
      background: rgba(13, 27, 50, 0.78);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(6px);
    }

    .pill strong {
      color: var(--gold);
    }

    .btn-jump {
      background: rgba(240, 200, 75, 0.16);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-jump:hover {
      background: rgba(240, 200, 75, 0.3);
    }

    /* Main Split Layout: 4x7 Calendar + Side Detail Panel */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 1050px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* 4x7 Calendar Grid matching your draft layout */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 720px) {
      .calendar-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .day-cell {
      position: relative;
      min-height: 122px;
      padding: 10px 8px;
      border-right: 1px solid rgba(165, 200, 255, 0.18);
      border-bottom: 1px solid rgba(165, 200, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      text-align: center;
    }

    /* Alternating row shading inspired by your draft image */
    .day-cell.row-mid {
      background: rgba(145, 178, 218, 0.14);
    }

    .day-cell:hover {
      background: rgba(240, 200, 75, 0.14);
      z-index: 2;
    }

    .day-cell.selected {
      background: rgba(240, 200, 75, 0.2);
      box-shadow: inset 0 0 0 2px var(--gold);
      z-index: 3;
    }

    .day-cell.today {
      box-shadow: inset 0 0 0 2px #38bdf8, 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .day-cell.today.selected {
      box-shadow: inset 0 0 0 2px var(--gold), 0 0 20px var(--gold-glow);
    }

    .cell-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .day-num {
      font-weight: 700;
      color: #fff;
    }

    .today-badge {
      background: #0284c7;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .steeped-check {
      color: var(--accent-green);
      font-weight: 700;
      font-size: 0.85rem;
    }

    .moon-icon {
      width: 46px;
      height: 46px;
      margin: 4px 0;
      filter: drop-shadow(0 0 6px rgba(255, 255, 230, 0.25));
    }

    .cell-tea-preview {
      font-size: 0.72rem;
      line-height: 1.25;
      color: #e2e8f0;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Side Detail Card (and Mobile Modal) */
    .detail-panel {
      background: var(--card-bg);
      border: 1px solid rgba(240, 200, 75, 0.4);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      position: sticky;
      top: 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .panel-moon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .panel-phase-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 700;
    }

    .panel-title {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      color: #fff;
      margin-top: 2px;
    }

    .tea-block {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .tea-slot-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .tag-day {
      background: rgba(110, 231, 183, 0.16);
      color: var(--accent-green);
      border: 1px solid rgba(110, 231, 183, 0.35);
    }

    .tag-evening {
      background: rgba(196, 181, 253, 0.16);
      color: var(--accent-herb);
      border: 1px solid rgba(196, 181, 253, 0.35);
    }

    .tea-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: #fff;
    }

    .tea-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin: 4px 0 8px;
    }

    .ingredient-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      background: rgba(15, 35, 66, 0.9);
      border: 1px solid rgba(148, 184, 235, 0.25);
      color: #dbeafe;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .focus-box {
      font-size: 0.88rem;
      color: #e2e8f0;
      background: rgba(240, 200, 75, 0.08);
      border-left: 3px solid var(--gold);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
    }

    .btn-steep {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #f0c84b, #d99b26);
      color: #0b1324;
      transition: transform 0.15s, filter 0.2s;
    }

    .btn-steep:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-steep.completed {
      background: linear-gradient(135deg, #34d399, #059669);
      color: #041d15;
    }
.tea-link {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px dashed rgba(240, 200, 75, 0.7);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .tea-link:hover {
      color: #fff;
      border-bottom: 1px solid #fff;
    }
  </style>
</head>

    // 2. Calculate current Lunar Day (1 to 28) from astronomical New Moon anchor
    function getCurrentLunarDay(date = new Date()) {
      const SYNODIC_MONTH = 29.53058867;
      // Known New Moon anchor: Jan 11, 2024 11:57 UTC
      const KNOWN_NEW_MOON = Date.UTC(2024, 0, 11, 11, 57, 0);
      const daysSince = (date.getTime() - KNOWN_NEW_MOON) / (1000 * 60 * 60 * 24);
      const cycleFraction = ((daysSince % SYNODIC_MONTH) + SYNODIC_MONTH) % SYNODIC_MONTH / SYNODIC_MONTH;
      // Map 0..1 cycle onto Days 1..28 (Day 1 = New Moon, Day 14 = Full Moon)
      const lunarDay = Math.floor(cycleFraction * 28) + 1;
      return Math.min(28, Math.max(1, lunarDay));
    }

// 3. Render accurate SVG Moon Phase matching your reference image progression:
    // Day 1 = New Moon (dark), Days 2-13 = Waxing on right, Days 14-15 = Full Moon, Days 16-27 = Waning on left, Day 28 = Dark Moon
    function createMoonSVG(day, className = "moon-icon") {
      const r = 20;
      const cx = 24;
      const cy = 24;
      let pathD = "";

      if (day === 1 || day === 28) {
        pathD = ""; // Completely dark New / Dark Moon
      } else if (day === 14 || day === 15) {
        // Full Moon across the center transition (end of row 2 & start of row 3)
        pathD = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx} ${cy + r} A ${r} ${r} 0 1 1 ${cx} ${cy - r}`;
      } else if (day < 14) {
        // Waxing (Days 2–13): illuminated from the right edge inward
        const p = (day - 1) / 13; // 0 (New) -> 1 (Full)
        const k = Math.cos(p * Math.PI); // +1 -> -1
        const rx = Math.abs(k) * r;
        const sweepInner = k > 0 ? 0 : 1;
        pathD = `M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy - r}`;
      } else {
        // Waning (Days 16–27): illuminated on the left edge, shrinking toward left
        const p = (day - 15) / 13; // 0 (Full) -> 1 (Dark)
        const k = Math.cos(p * Math.PI); // +1 -> -1
        const rx = Math.abs(k) * r;
        const sweepInner = k > 0 ? 0 : 1;
        pathD = `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${rx} ${r} 0 0 ${sweepInner} ${cx} ${cy - r}`;
      }

      return `
        <svg viewBox="0 0 48 48" class="${className}" aria-hidden="true">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#070d19" stroke="rgba(226, 232, 240, 0.35)" stroke-width="1.2"/>
          ${pathD ? `<path d="${pathD}" fill="#e8edf5" />` : ""}
        </svg>
      `;
    }

    // 7. Procedural Starry Background Canvas
    function initStarfield() {
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = Array.from({ length: 180 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          alpha: Math.random() * 0.8 + 0.2
        }));
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.fill();
        });
      }

      window.addEventListener("resize", resize);
      resize();
    }

    document.getElementById("jump-today-btn").addEventListener("click", () => {
      selectedDay = todayLunarDay;

      renderDetailPanel();
    });

    // Initialize Page
